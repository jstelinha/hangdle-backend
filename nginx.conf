# Rubrica de Devops - Configuração nginx
events {}

http {
  # Não diz a versão do nginx no cabeçalho Server nem nas páginas de erro.
  server_tokens off;

  server {
    listen 80;

    # Cabeçalhos de segurança, para o front e para a API. O token fica no localStorage, então a CSP é a defesa
    # contra um XSS: só roda script, estilo e chamada para o próprio site.
    # Atenção: um add_header dentro de um location faz o nginx esquecer estes. Se um location precisar de um
    # cabeçalho próprio, repita estes lá dentro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
      proxy_pass http://backend:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
    }
  }
}
