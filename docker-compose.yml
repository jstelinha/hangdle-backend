
name: cade

services:
  db:
    image: mysql:8.4
    container_name: hangdle_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - rede-interna

  backend:
    build: .
    container_name: hangdle_backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SEGREDO: ${JWT_SEGREDO}
      JWT_EXPIRACAO_SEGUNDOS: ${JWT_EXPIRACAO_SEGUNDOS:-7200}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost,http://localhost:5173}
      TENTATIVAS_POR_JANELA: ${TENTATIVAS_POR_JANELA:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-interna
      - rede-externa

  frontend:
    build: ../hangdle-frontend
    container_name: hangdle_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - rede-externa

  nginx:
    image: nginx:alpine
    container_name: hangdle_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data:
