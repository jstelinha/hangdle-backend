
name: hangdle

# Rubrica de Devops - Organização do docker-compose.yml - Um serviço por papel (banco, API, front e nginx), cada um com as suas redes; as senhas vêm do .env e os dados ficam no volume db_data
services:
  db:
    image: mysql:8.4
    container_name: hangdle_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Rubrica de Devops - Persistência de dados no MySQL - O banco fica no volume db_data, fora do container: os dados continuam depois de parar, reiniciar ou recriar o container (só o down -v apaga)
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - rede-interna

  backend:
    build: .
    container_name: hangdle_backend
    restart: always
    # Rubrica de Devops - Integração entre serviços - A API acha o MySQL pelo nome do serviço (db), na rede interna, e só liga depois que ele responde ao healthcheck
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SEGREDO: ${JWT_SEGREDO}
      JWT_EXPIRACAO_SEGUNDOS: ${JWT_EXPIRACAO_SEGUNDOS:-7200}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost,http://localhost:5173}
      TENTATIVAS_POR_JANELA: ${TENTATIVAS_POR_JANELA:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-interna
      - rede-externa

  frontend:
    build: ../hangdle-frontend
    container_name: hangdle_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - rede-externa

  nginx:
    image: nginx:alpine
    container_name: hangdle_nginx
    restart: always
    # Rubrica de Devops - Isolamento e restrição de acesso via Docker Network - Só o nginx tem porta fora do Docker
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Rubrica de Devops - Integração entre serviços - O nginx leva o / para o front e o /api/ para a API (nginx.conf): é assim que o front consome o back
    depends_on:
      - frontend
      - backend
    networks:
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data:
